services:
  os-oracle-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tituspaine/os-oracle:local
    stdin_open: true
    tty: true
  os-oracle-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: tituspaine/os-oracle-web:local
    command: ["node", "src/start.ts"]
    ports:
      - "3000:3000"
